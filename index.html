<!DOCTYPE html>
<html>
<head>
    <title>Palacio Inmobiliaria - VR Tours</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f9f9f9; }
        .tours { display: flex; gap: 20px; flex-wrap: wrap; }
        .tour-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s;
            width: 250px;
        }
        .tour-card:hover { transform: translateY(-5px); }
        h1 { color: #1a1a1a; }
    </style>
</head>
<body>
    <h1>Recorridos Virtuales - Palacio Inmobiliaria</h1>
    <div class="tours">
        <a href="./tour_carmelita/" class="tour-card">
            <h3>🏠 Casa La Carmelita</h3>
            <p>Ver recorrido 360&deg;</p>
        </a>
        <a href="./cafelia/" class="tour-card">
            <h3>🏠 Cafelia</h3>
            <p>Ver recorrido 360&deg;</p>
        </a>
    </div>
</body>
</html>
